<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | RSN</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #092f58 0%, #14578b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pw-box {
            background: #fff;
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            padding: 40px 35px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
        }

        .pw-box .icon-head {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--navy, #092f58), #14578b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd447;
            font-size: 28px;
        }

        .pw-box h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #092f58;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .pw-box p.sub {
            text-align: center;
            color: #65758a;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .pw-box .warn {
            background: #fff8e1;
            border-left: 4px solid #ffb300;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #6b5500;
            margin-bottom: 22px;
        }

        .pw-field {
            margin-bottom: 18px;
        }

        .pw-field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #38516a;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pw-field .wrap {
            position: relative;
        }

        .pw-field .wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #65758a;
        }

        .pw-field input {
            width: 100%;
            padding: 14px 15px 14px 44px;
            border: 1.5px solid #dbe4ed;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fbfcfe;
            transition: all 0.25s ease;
        }

        .pw-field input:focus {
            border-color: #092f58;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(9, 47, 88, 0.08);
        }

        .pw-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d71938, #b9102c);
            color: white;
            border: 0;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(215, 25, 56, 0.25);
            transition: all 0.25s ease;
        }

        .pw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(215, 25, 56, 0.35);
        }

        .logout-link {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #65758a;
        }

        .logout-link a {
            color: #d71938;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="pw-box">
        <div class="icon-head"><i class="fa-solid fa-key"></i></div>
        <h1>Set New Password</h1>
        <p class="sub">This is your first login. Please set a secure password.</p>
        <div class="warn">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <strong>Important:</strong> Your default password will stop working once you set a new one.
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div
            style="padding:12px; background:{% if cat=='error' %}#ffeaee{% else %}#e3f5eb{% endif %}; color:{% if cat=='error' %}#d71938{% else %}#168254{% endif %}; border-radius:8px; font-size:12px; margin-bottom:15px;">
            {{ msg }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="pw-field">
                <label>New Password</label>
                <div class="wrap"><i class="fa-solid fa-lock"></i>
                    <input type="password" name="new_password" placeholder="Min 6 characters" minlength="6" required>
                </div>
            </div>
            <div class="pw-field">
                <label>Confirm Password</label>
                <div class="wrap"><i class="fa-solid fa-lock"></i>
                    <input type="password" name="confirm_password" placeholder="Re-enter password" minlength="6"
                        required>
                </div>
            </div>
            <button type="submit" class="pw-btn">
                <i class="fa-solid fa-check"></i> Save Password
            </button>
        </form>
        <div class="logout-link">
            Not you? <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
</body>

</html>
